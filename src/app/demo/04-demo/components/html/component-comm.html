<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1>内置控制流</h1>
  <div class="demo-box">
    @defer (on viewport) {
      <div>最终显示内容</div>
    } @placeholder (minimum 500ms) {
      <div>占位</div>
    } @loading (after 100ms; minimum 1s) {
      <p>加载中....</p>
    } @error {
      <p>加载失败,请稍后再试...</p>
    }
  </div>

  <div class="demo-box">
    @defer (on idle) {
      <div>最终显示内容2</div>
    } @placeholder (minimum 500ms) {
      <div>占位2</div>
    } @loading (after 100ms; minimum 1s) {
      <p>加载中2....</p>
    } @error {
      <p>加载失败,请稍后再试2...</p>
    }
  </div>
</body>
</html>
