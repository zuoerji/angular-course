<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1>内置控制流</h1>
  <div>
    <ul>
      <li *ngFor="let item of list(); trackBy: trackById">
        {{ item.name }} - {{ item.age }}
      </li>
    </ul>
  </div>

  <div>
    @for( item of list1(); track item.id ) {
      <li> {{ item.name }} -- {{ item.age }} </li>
    } @empty {
      <li> 没有数据 </li>
    }

  </div>
</body>
</html>
