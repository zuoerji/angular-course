<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>
<body>
    <h1>表单</h1>
    <div class="card">
        <div class="card-title">表单</div>
        <div class="form-row">
            <label for="">用户名</label>
            <input class="form-input" [formField]="f.name">
            <button (click)="changeName()">改变 name</button>
            <button (click)="modelChangeName()">model 改变 name</button>
        </div>
    </div>
    <div class="card">
        <p> model().name : {{ model().name }} </p>
        <p> f.name().value(): {{ f.name().value() }} </p>
        <p> f().value().name : {{ f().value().name }} </p>
    </div>
</body>
</html>
