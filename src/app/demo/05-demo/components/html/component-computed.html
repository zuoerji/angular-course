<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1>signal</h1>
  <div class="demo-box">
    <div>数量: <span> {{ count() }} </span></div>
    <div>单价: <span> {{ price() }} </span></div>
    <div>总价: <span> {{ total() }} </span></div>

    <button class="primary" (click)="bumpPrice()">数量 + 1</button> <br>
    <button class="primary" (click)="readThree()"> 调用三次 computed </button>
  </div>
</body>
</html>
