<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>
<body>
    <h1>HTTP-拦截器</h1>
    <div class="demo-box">
        <div> 请求结果: {{ result() }} </div>
        <button (click)="catchError()">错误处理</button>

        <button (click)="timeout()">超时</button>
    </div>
</body>
</html>
